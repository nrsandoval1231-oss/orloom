<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Forge Living Loom</title><style>body{margin:0;background:#080d12;color:#f0e9df;font:14px system-ui;overflow:hidden}canvas{width:100vw;height:100vh;touch-action:none;display:block}.head{position:absolute;top:22px;left:25px;pointer-events:none}.head small{color:#c8a777;letter-spacing:3px}.head h1{margin:8px 0 4px;font-size:25px;font-weight:500}.muted{color:#82949d;font-size:12px}.panel{position:absolute;bottom:20px;left:20px;background:#111b22e8;border:1px solid #34424a;border-radius:15px;padding:17px;width:320px;backdrop-filter:blur(10px)}.right{position:absolute;right:20px;bottom:20px;background:#111b22e8;border:1px solid #34424a;border-radius:15px;padding:16px;width:185px}.tag{color:#c8a777;font-size:11px;letter-spacing:1.5px}.metrics{display:flex;gap:12px;margin:13px 0}.metric{flex:1;background:#1a252c;border-radius:8px;padding:10px}.metric b{display:block;font-size:21px}.metric span{font-size:10px;color:#8fa0a7}.bar{height:4px;background:#303e43;border-radius:5px;overflow:hidden}.fill{height:100%;background:#d6b58a}input{width:100%;accent-color:#d6b58a;margin:14px 0}button{background:#24323a;color:#f0e9df;border:1px solid #485a61;border-radius:7px;padding:9px;margin:3px;cursor:pointer}button:hover{background:#3c4c55}.agent{margin:13px 0;font-size:12px}.agent i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#6e858e;white-space:nowrap}.badge{position:absolute;right:20px;top:25px;color:#a6b4ba;font-size:10px}.detail{position:absolute;right:20px;top:95px;width:210px;background:#17232c;border:1px solid #52636b;border-radius:12px;padding:15px;display:none}@media(max-width:650px){.head{top:16px;left:15px}.head h1{font-size:19px}.head .muted{max-width:190px}.badge{top:18px;right:12px;font-size:8px;max-width:110px;text-align:right}.panel{bottom:10px;left:10px;width:calc(100vw - 52px);padding:15px}.right{top:104px;right:10px;bottom:auto;width:112px;padding:10px}.agent{font-size:10px;margin:9px 0}.hint{display:none}.detail{top:265px;right:10px;width:160px}}</style></head><body><canvas id="c"></canvas><div class="head"><small>FORGE / EXPERIMENT 001</small><h1>THE LIVING LOOM</h1><div class="muted">Watch a mission become verified software</div></div><div class="badge">● SYNTHETIC ACTIVITY · NOT LIVE</div><div class="panel"><div class="tag">MISSION / UNIVERSAL MEMORY APP</div><div class="metrics"><div class="metric"><b id="pct">62%</b><span>Verified</span></div><div class="metric"><b id="units">31</b><span>Work units</span></div><div class="metric"><b id="flags">2</b><span>Drift flags</span></div></div><div class="bar"><div id="fill" class="fill" style="width:62%"></div></div><input id="progress" type="range" min="0" max="100" value="62"><div><button id="play">Pause agents</button><button id="step">Verify +5%</button><button id="drift">Toggle drift</button><button id="reset">Reset</button></div></div><div class="right"><div class="tag">ACTIVE AGENTS</div><div id="agents"></div></div><div class="detail" id="detail"><b id="sector"></b><p id="description" class="muted"></p><button onclick="document.getElementById('detail').style.display='none'">Close</button></div><div class="hint">Drag to rotate · Scroll to zoom · Tap a sector to inspect</div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D,rx=-.38,ry=.4,z=1,progress=62,run=true,drift=true,t=0,down=null;const colors=['#d8b582','#8db8c9','#9fc6ab','#b3a1d1','#e4e7df'];const names=['Frontend / UI','Backend / Services','Data / Memory','Infrastructure','Verification'];const descriptions=['Mobile interface, capture flows, user experience.','Application services, API, business logic.','Database, memory and retrieval.','Deployments, cloud runtime, integrations.','Independent tests, review and acceptance evidence.'];const agents=['Architect','Builder A','Builder B','Validator','Athena'];document.getElementById('agents').innerHTML=agents.map((a,i)=>`<div class="agent"><i style="background:${colors[i]};box-shadow:0 0 9px ${colors[i]}"></i>${a}</div>`).join('');function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();function proj(x,y,v){let cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),a=x*cy-v*sy,b=x*sy+v*cy,q=y*cx-b*sx,d=y*sx+b*cx,s=Math.min(W*.31,H*.42)*z*3.5/(3.5+d);return [W*.51+a*s,H*(W<650?.43:.47)+q*s,d]}function tor(a,b){return [(1+.29*Math.cos(b))*Math.cos(a),(1+.29*Math.cos(b))*Math.sin(a),.29*Math.sin(b)]}function line(a,b,col,alpha,width=1){g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=width;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();g.globalAlpha=1}function frame(){g.fillStyle='#080d12';g.fillRect(0,0,W,H);let grad=g.createRadialGradient(W*.51,H*.46,5,W*.51,H*.46,Math.max(W,H)*.55);grad.addColorStop(0,'#192630');grad.addColorStop(1,'#080d12');g.fillStyle=grad;g.fillRect(0,0,W,H);const segs=[],max=progress/100*Math.PI*2;for(let j=0;j<52;j++){let b=j/52*Math.PI*2;for(let k=0;k<190;k++){let a=k/190*Math.PI*2;if(a>=max)continue;let a2=Math.min((k+1)/190*Math.PI*2,max),p=proj(...tor(a,b)),q=proj(...tor(a2,b)),s=Math.min(4,Math.floor(a/(Math.PI*2)*5)),bad=drift&&s===1&&j%4===0;segs.push({p,q,s,bad,depth:(p[2]+q[2])/2,j})}}segs.sort((a,b)=>b.depth-a.depth);for(const v of segs)line(v.p,v.q,v.bad?'#e8756d':colors[v.s],v.bad?.85:.13+(v.j%8)*.055,v.depth<0?1.1:.65);for(let i=0;i<140;i++){let a=(i*2.4+t*.2)%(Math.PI*2);if(a>max)continue;let b=(i*1.3+t*.3)%(Math.PI*2),p=proj(...tor(a,b));g.fillStyle=colors[Math.min(4,Math.floor(a/(Math.PI*2)*5))];g.globalAlpha=.3+(i%5)*.12;g.beginPath();g.arc(p[0],p[1],i%13===0?2:1,0,7);g.fill()}g.globalAlpha=1;let center=proj(0,0,0);g.textAlign='center';g.fillStyle='#e9d6b6';g.font='600 12px system-ui';g.fillText('MISSION',center[0],center[1]-4);g.font='10px system-ui';g.fillStyle='#8ea4ad';g.fillText('RECALL',center[0],center[1]+13);for(let i=0;i<5;i++){let a=i*Math.PI*2/5-.3,p=proj(Math.cos(a)*1.7,Math.sin(a)*1.7,Math.sin(a*2)*.2),q=proj(...tor((i+.5)*Math.PI*2/5,0));line(p,q,colors[i],.25);g.fillStyle=colors[i];g.shadowColor=colors[i];g.shadowBlur=15;g.beginPath();g.arc(p[0],p[1],5,0,7);g.fill();g.shadowBlur=0;if(run){let f=(t*.15+i*.17)%1;g.beginPath();g.arc(p[0]*(1-f)+q[0]*f,p[1]*(1-f)+q[1]*f,2.7,0,7);g.fill()}}if(run)t+=.016;requestAnimationFrame(frame)}frame();function update(){document.getElementById('pct').textContent=progress+'%';document.getElementById('units').textContent=Math.round(progress/2);document.getElementById('flags').textContent=drift&&progress>25?'2':'0';document.getElementById('fill').style.width=progress+'%';document.getElementById('progress').value=progress}document.getElementById('progress').oninput=e=>{progress=+e.target.value;update()};document.getElementById('step').onclick=()=>{progress=Math.min(100,progress+5);update()};document.getElementById('reset').onclick=()=>{progress=0;update()};document.getElementById('drift').onclick=()=>{drift=!drift;update()};document.getElementById('play').onclick=e=>{run=!run;e.target.textContent=run?'Pause agents':'Resume agents'};c.onpointerdown=e=>{down=[e.clientX,e.clientY,e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;ry+=(e.clientX-down[2])*.006;rx+=(e.clientY-down[3])*.006;down[2]=e.clientX;down[3]=e.clientY};c.onpointerup=e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<5){let a=(Math.atan2(e.clientY-H*.47,e.clientX-W*.51)+2*Math.PI)%(2*Math.PI),i=Math.min(4,Math.floor(a/(Math.PI*2)*5));document.getElementById('sector').textContent=names[i];document.getElementById('description').textContent=descriptions[i]+' Synthetic data; real evidence will be connected later.';document.getElementById('detail').style.display='block'}down=null};c.addEventListener('wheel',e=>{e.preventDefault();z=Math.max(.5,Math.min(2.3,z*(e.deltaY>0?.94:1.06)))},{passive:false});
</script></body></html>
